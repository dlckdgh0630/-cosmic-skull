<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Skull</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Three.js extras (OBJLoader, MeshSurfaceSampler, post-processing, shaders) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/math/MeshSurfaceSampler.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/ShaderPass.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- 웹캠 & 손 랜드마크 캔버스 (오른쪽 하단) -->
  <div id="cam-wrap">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="hand-canvas"></canvas>
    <div id="gesture-label">손을 인식하는 중...</div>
  </div>

  <!-- 속도 조절 패널 (오른쪽 상단) -->
  <div id="speed-panel">
    <div class="sp-title">⚙ 속도 조절</div>
    <div class="sp-row">
      <div class="sp-label">복구 속도 <span id="val-restore">6</span></div>
      <input type="range" class="sp-slider" id="sl-restore" min="1" max="10" step="1" value="6">
    </div>
    <div class="sp-row">
      <div class="sp-label">폭발 강도 <span id="val-explode">5</span></div>
      <input type="range" class="sp-slider" id="sl-explode" min="1" max="10" step="1" value="5">
    </div>
  </div>

  <!-- 상태 표시 HUD -->
  <div id="hud">
    <div class="hud-row"><span class="hud-key">오른손</span><span id="hud-right">-</span></div>
    <div class="hud-row"><span class="hud-key">왼손</span><span id="hud-left">-</span></div>
  </div>

  <!-- Vertex Shader (파티클) -->
  <script type="x-shader/x-vertex" id="vertexshader">
    attribute float size;
    attribute vec3 customColor;
    varying vec3 vColor;
    void main() {
      vColor = customColor;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <!-- Fragment Shader (파티클) -->
  <script type="x-shader/x-fragment" id="fragmentshader">
    uniform sampler2D pointTexture;
    varying vec3 vColor;
    void main() {
      gl_FragColor = vec4(vColor, 1.0);
      gl_FragColor = gl_FragColor * texture2D(pointTexture, gl_PointCoord);
      if (gl_FragColor.a < 0.05) discard;
    }
  </script>

  <script src="main.js"></script>
</body>
</html>
